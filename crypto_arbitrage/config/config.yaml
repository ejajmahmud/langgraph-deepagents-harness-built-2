# 数字货币套利交易系统配置文件 V5.2
# 智能深度集成版 - 完整Memo0语义搜索 + AI驱动低风险套利

# DeepAgents 配置
system:
  name: "CryptoArbitrage"
  version: "5.2"
  mode: "simulation"  # simulation, paper_trading, live_trading

model:
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  temperature: 0.0
  max_tokens: 4096

# 交易所配置
exchanges:
  binance:
    enabled: true
    api_key: "YOUR_BINANCE_API_KEY"
    secret: "YOUR_BINANCE_SECRET"
    testnet: false
    options:
      defaultType: "spot"

  okx:
    enabled: true
    api_key: "YOUR_OKX_API_KEY"
    secret: "YOUR_OKX_SECRET"
    passphrase: "YOUR_OKX_PASSPHRASE"
    testnet: false
    options:
      defaultType: "spot"

  huobi:
    enabled: false
    api_key: "YOUR_HUOBI_API_KEY"
    secret: "YOUR_HUOBI_SECRET"
    testnet: false
    options:
      defaultType: "spot"

# 风险管理配置
risk_management:
  max_daily_loss: 500
  max_position_size: 1000
  max_total_exposure: 5000
  max_drawdown: 10.0
  min_liquidity_ratio: 0.5
  base_stop_loss: 2.0
  base_take_profit: 1.0
  trailing_stop: 0.5
  risk_reward_ratio: 2.0

# TradingAgents配置 (V2.9 - 深度集成)
trading_agents:
  enabled: true  # V2.9: 启用TradingAgents深度集成
  provider: "anthropic"  # openai/google/anthropic/xai/openrouter/ollama
  model: "claude-sonnet-4-6"
  language: "Chinese"
  preset: "standard"  # quick/standard/deep
  cache_ttl: 300  # LLM分析缓存时间（秒）
  signal_weight: 0.35  # V2.9: LLM信号权重（0-1）

# ========================================
# V5.2 智能决策引擎配置
# ========================================
intelligent_decision_engine_v5_2:
  enabled: true  # 启用V5.2智能决策引擎
  cache_ttl: 300  # 决策缓存时间（秒）
  cache_size: 1000  # 最大缓存条目数
  fallback_enabled: true  # 启用降级机制
  memo0_top_k: 20  # Memo0搜索返回数量
  fallback_top_k: 10  # 降级搜索返回数量
  confidence_threshold: 0.7  # 决策置信度阈值

# ========================================
# V5.2 增强版低风险套利引擎配置
# ========================================
enhanced_low_risk_engine_v5_2:
  enabled: true  # 启用V5.2增强版低风险套利引擎
  enable_risk_prediction: true  # 启用预测性风险管理
  enable_health_monitoring: true  # 启用健康监控
  enable_intelligent_decision: true  # 启用智能决策
  enable_execution_optimization: true  # 启用执行路径优化
  enable_knowledge_learning: true  # 启用知识学习

  risk_thresholds:
    low: 0.3
    medium: 0.6
    high: 0.8

  prediction_interval: 60  # 风险预测间隔（秒）
  health_check_interval: 30  # 健康检查间隔（秒）
  decision_confidence_threshold: 0.7  # 决策置信度阈值

  adaptive_risk:
    enabled: true  # 启用自适应风险参数
    low_risk_multiplier: 1.2  # 低风险调整因子
    medium_risk_multiplier: 1.0  # 中风险调整因子
    high_risk_multiplier: 0.6  # 高风险调整因子
    critical_risk_multiplier: 0.3  # 极高风险调整因子

  execution_optimization:
    enabled: true  # 启用执行优化
    cross_exchange_optimization: true  # 跨交易所优化
    triangular_optimization: true  # 三角套利优化
    historical_performance_weight: 0.7  # 历史表现权重
    current_conditions_weight: 0.3  # 当前条件权重

  knowledge_learning:
    enabled: true  # 启用知识学习
    auto_extract: true  # 自动提取知识
    learning_interval: 300  # 学习间隔（秒）
    quality_threshold: 0.6  # 知识质量阈值

# 增强版低风险套利引擎配置 (V4.1) - 保留兼容性
enhanced_low_risk_engine:
  enabled: true
  enable_risk_prediction: true
  enable_health_monitoring: true
  enable_intelligent_decision: true
  risk_thresholds:
    low: 0.3
    medium: 0.6
    high: 0.8
  prediction_interval: 60
  health_check_interval: 30
  decision_confidence_threshold: 0.7

# 信号融合配置 (V2.6)
signal_fusion:
  enabled: true
  use_dynamic_weights: true
  weights:
    llm: 0.35        # LLM信号权重
    technical: 0.25   # 技术指标权重
    arbitrage: 0.25   # 套利信号权重
    risk: 0.15        # 风险信号权重
  divergence_threshold: 0.7  # 分歧警告阈值

# 可视化配置 (V2.6)
visualization:
  backtest_charts:
    enabled: true
    show_equity_curve: true
    show_drawdown: true
    show_returns_distribution: true
    show_monthly_heatmap: true
  knowledge_graph:
    enabled: true
    similarity_threshold: 0.3
    max_nodes: 50
  market_3d:
    enabled: true
    default_chart_type: "scatter"  # scatter/bar/surface

# ========================================
# Memo0 配置 (V5.2 - 完整AI功能 + Phase 8本地存储)
# ========================================
# Phase 8更新：支持本地向量存储，无需API密钥
# 获取 API Key: https://platform.mem0.ai
# 环境变量优先: MEM0_API_KEY > config.yaml
mem0:
  # 存储类型选择（Phase 8新增）
  storage_type: "local_vector"  # auto, mem0, local_vector, simple

  # Memo0 API配置（用于云存储）
  api_key: ""  # 在 .env 文件中设置 MEM0_API_KEY
  user_id: "crypto-arbitrage-v52-user"
  agent_id: "trading-bot-v52"
  rerank: true
  keyword_search: false
  top_k: 10
  score_threshold: 0.7
  cache_ttl: 300

  # Phase 8 本地向量存储配置
  local_vector:
    enabled: true  # 启用本地向量存储
    db_path: "./data/local_vector_db.sqlite3"  # 数据库路径
    cache_enabled: true  # 启用搜索缓存
    cache_size: 1000  # 缓存大小

  # V5.2 智能搜索配置
  semantic_search:
    enabled: true  # 启用语义搜索
    similarity_threshold: 0.7  # 相似度阈值
    max_results: 20  # 最大返回结果数
    enable_reranking: true  # 启用重排序

  # V5.2 知识管理配置
  knowledge_management:
    enabled: true  # 启用知识管理
    auto_classification: true  # 自动分类
    quality_scoring: true  # 质量评分
    duplicate_detection: true  # 重复检测
    knowledge_expiry: 2592000  # 知识过期时间（30天）

# 交易执行引擎配置
transaction_executor:
  enabled: true
  max_concurrent_trades: 3
  execution_timeout: 30
  auto_retry: true
  retry_delay: 5

# 监控系统配置
monitoring:
  enabled: true
  alert_methods:
    - console
    - memo0
    - file
  performance_thresholds:
    scan_timeout: 10
    execution_failure_rate: 0.1
    low_profit_rate: 0.1
    low_win_rate: 50
  metrics_interval: 60

# 通知系统配置
notifications:
  enabled: true
  rate_limit_interval: 60
  channels:
    - type: "console"
      enabled: true
    - type: "file"
      enabled: true
    - type: "memo0"
      enabled: true
    - type: "email"
      enabled: false
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      username: "your_email@gmail.com"
      password: "your_app_password"
      to_addresses:
        - "trader@example.com"
    - type: "telegram"
      enabled: false
      bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
      chat_id: "YOUR_TELEGRAM_CHAT_ID"
    - type: "webhook"
      enabled: false
      url: "YOUR_WEBHOOK_URL"

# 策略管理器配置
strategy_manager:
  max_total_capital: 10000
  max_strategy_allocation: 0.40
  min_opportunity_score: 60
  signal_aggregation: "weighted"

# 套利策略配置
strategies:
  cross_exchange:
    enabled: true
    min_profit_rate: 0.5
    max_position_size: 1000
    risk_tolerance: 0.1
    symbols:
      - "BTC/USDT"
      - "ETH/USDT"
      - "BNB/USDT"
      - "SOL/USDT"
      - "DOGE/USDT"
    scan_interval: 30
    max_volatility: 5.0
    min_liquidity: 10000
    max_slippage: 0.1

  triangular:
    enabled: true
    min_profit_rate: 0.3
    max_position_size: 500
    scan_interval: 30
    triangles:
      - base: "USDT"
        path:
          - from: "USDT"
            to: "BTC"
            pair: "BTC/USDT"
          - from: "BTC"
            to: "ETH"
            pair: "ETH/BTC"
          - from: "ETH"
            to: "USDT"
            pair: "ETH/USDT"
      - base: "USDT"
        path:
          - from: "USDT"
            to: "BTC"
            pair: "BTC/USDT"
          - from: "BTC"
            to: "BNB"
            pair: "BNB/BTC"
          - from: "BNB"
            to: "USDT"
            pair: "BNB/USDT"

  basis_trading:
    enabled: true
    min_profit_rate: 0.8
    max_position_size: 2000
    symbols:
      - "BTC/USDT"
      - "ETH/USDT"
    futures_exchange: "binance"
    min_basis_spread: 0.2
    holding_period: 7
    execution_timeout: 120

  funding_rate:
    enabled: true
    min_funding_rate: 0.05
    max_position_size: 1500
    max_funding_rate: 0.5
    holding_periods: 3
    symbols:
      - "BTC/USDT:USDT"
      - "ETH/USDT:USDT"
    spot_symbols:
      - "BTC/USDT"
      - "ETH/USDT"

  statistical_arbitrage:
    enabled: true
    min_profit_rate: 0.4
    max_position_size: 800
    lookback_period: 100
    z_score_threshold: 2.0
    z_score_close: 0.5
    max_holding_period: 86400
    pairs:
      - asset1: "BTC/USDT"
        asset2: "ETH/USDT"
        name: "BTC-ETH"
      - asset1: "BTC/USDT"
        asset2: "SOL/USDT"
        name: "BTC-SOL"

# 系统运行配置
runtime:
  scan_interval: 30
  max_concurrent_trades: 3
  trade_timeout: 60
  log_level: "INFO"

# 性能优化配置 (V2.7)
performance:
  enabled: true
  async_llm:
    enabled: true
    max_workers: 3
    cache_ttl: 300
    timeout: 120
  signal_cache:
    enabled: true
    max_size: 1000
    default_ttl: 60
  optimized_viz:
    enabled: true
    max_points: 1000
    use_cache: true
  monitoring:
    enabled: true
    window_size: 100
    alert_threshold: 2.0

# V5.0 性能优化配置
performance_v5:
  lazy_loading:
    enabled: true
    preload_components:
      - exchange_manager
      - risk_manager
      - monitoring
  dynamic_imports:
    enabled: true
    cache_imported_modules: true
  async_initialization:
    enabled: false  # 当前版本同步初始化
    max_parallel_tasks: 3
  strategy_cache:
    enabled: true
    cache_size: 100
    ttl: 3600

# ========================================
# V3.0 智能优化引擎配置
# ========================================
intelligent_optimizer:
  enabled: true  # 启用智能优化引擎
  optimization_interval: 300  # 优化间隔（秒）
  history_window: 1000  # 历史数据窗口
  min_data_points: 50  # 最小数据点数
  config_path: "config/optimization_state.json"  # 优化状态存储路径

# ========================================
# V3.0 智能知识管理器配置
# ========================================
knowledge_manager_v3:
  enabled: true  # 启用智能知识管理器
  auto_classification: true  # 自动分类
  quality_scoring: true  # 质量评分
  recommendation_enabled: true  # 启用推荐
  processing_interval: 60  # 处理间隔（秒）

# ========================================
# V3.0 自适应错误处理器配置
# ========================================
adaptive_error_handler:
  enabled: true  # 启用自适应错误处理器
  max_retries: 3  # 最大重试次数
  retry_delay: 1.0  # 重试延迟（秒）
  backoff_factor: 2.0  # 退避因子
  circuit_breaker:
    enabled: true  # 启用熔断器
    failure_threshold: 5  # 失败阈值
    recovery_timeout: 120  # 恢复超时（秒）
  prevention:
    enabled: true  # 启用错误预防
    learning_enabled: true  # 启用错误学习
    pattern_detection: true  # 启用模式检测

# 存储配置
storage:
  knowledge_base_db: "crypto_arbitrage_knowledge.db"
  trade_log_path: "logs/trades.log"
  performance_log_path: "logs/performance.log"
  alerts_log_path: "logs/alerts_*.log"
  auto_save_interval: 300

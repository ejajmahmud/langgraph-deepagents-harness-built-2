# Docker Compose configuration for CryptoArbitrage Trading System
# V2.3 - Production Ready Deployment

version: '3.8'

services:
  # Main Trading System
  crypto-arbitrage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-arbitrage-main
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist data and logs
      - ./logs:/app/logs
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./storage:/app/storage
      # Configuration
      - ./config:/app/config:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Monitoring Service (Prometheus - optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: crypto-arbitrage-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - crypto-net
    profiles:
      - monitoring

  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: crypto-arbitrage-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - crypto-net
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Redis Cache (optional - for performance optimization)
  redis:
    image: redis:7-alpine
    container_name: crypto-arbitrage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - cache

networks:
  crypto-net:
    driver: bridge

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  redis-data:
    driver: local
